name: Publish Orca Linux Hardened

on:
  push:
    branches: [orca-hardening-ci]
    paths:
      - '.github/workflows/publish-orca-linux-hardened.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-orca-linux-hardened
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: stablyai/orca
  UPSTREAM_SHA: 67e22345daf882190911355eed152ef33e051c5e
  HARDENING_HARNESS_SHA: afaa3421e392361db5fb1142e9be4c017095af6e
  VERIFIED_BUILD_RUN_ID: '33943045541'
  VERIFIED_ARTIFACT_NAME: orca-linux-hardened-26.9.5-hardened.3-amd64
  VERSION: 26.9.5-hardened.3
  SOURCE_BRANCH: orca-linux-hardened-source
  RELEASE_TAG: orca-linux-hardened-v26.9.5-hardened.3
  EXPECTED_DEB_SHA256: 5964e1183e829bc8328db2427772ad0196162b93392aa4661762588985fe4e60

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact verified hardening harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HARDENING_HARNESS_SHA }}
          path: harness

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: source
          fetch-depth: 1

      - name: Download the verified Linux release artifact
        run: |
          set -euo pipefail
          mkdir -p verified-artifact
          gh run download "$VERIFIED_BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$VERIFIED_ARTIFACT_NAME" \
            --dir verified-artifact
          find verified-artifact -maxdepth 5 -type f -printf '%s %p\n' | sort

      - name: Resolve and verify release inputs
        run: |
          set -euo pipefail
          deb="$(find verified-artifact -type f -name "orca-ide_${VERSION}_amd64.deb" -print -quit)"
          verified_patch="$(find verified-artifact -type f -name 'orca-linux-hardened.patch' -print -quit)"
          install_doc="$(find verified-artifact -type f -name 'INSTALL-LINUX.md' -print -quit)"
          build_manifest="$(find verified-artifact -type f -name 'BUILD-MANIFEST.txt' -print -quit)"
          test -n "$deb" && test -s "$deb"
          test -n "$verified_patch" && test -s "$verified_patch"
          test -n "$install_doc" && test -s "$install_doc"
          test -n "$build_manifest" && test -s "$build_manifest"
          actual_sha="$(sha256sum "$deb" | cut -d' ' -f1)"
          test "$actual_sha" = "$EXPECTED_DEB_SHA256"
          printf 'DEB=%s\nVERIFIED_PATCH=%s\nINSTALL_DOC=%s\nBUILD_MANIFEST=%s\n' \
            "$deb" "$verified_patch" "$install_doc" "$build_manifest" >> "$GITHUB_ENV"

      - name: Reconstruct the exact released source
        run: |
          set -euo pipefail
          base64 -d harness/orca-hardening/patches/task1-green.patch.gz.b64 | gzip -d > /tmp/task1.patch
          cd source
          git apply --check /tmp/task1.patch
          git apply /tmp/task1.patch

          cp ../harness/orca-hardening/source/src/main/daemon/linux-terminal-spawn-admission.ts src/main/daemon/
          cp ../harness/orca-hardening/source/src/main/daemon/linux-terminal-spawn-admission.test.ts src/main/daemon/
          cp ../harness/orca-hardening/source/src/main/daemon/daemon-server-linux-admission.test.ts src/main/daemon/
          python ../harness/orca-hardening/scripts/apply-task2-wiring.py

          cp ../harness/orca-hardening/source/src/main/runtime/orchestration/worker-terminal-auto-release.ts src/main/runtime/orchestration/
          cp ../harness/orca-hardening/source/src/main/runtime/orchestration/worker-terminal-auto-release.test.ts src/main/runtime/orchestration/
          cp ../harness/orca-hardening/source/src/main/runtime/rpc/methods/orchestration-worker-auto-release-wiring.test.ts src/main/runtime/rpc/methods/
          python ../harness/orca-hardening/scripts/apply-task3-wiring.py

          cp ../harness/orca-hardening/source/resources/linux/bin/orca-hardened-desktop resources/linux/bin/
          cp ../harness/orca-hardening/source/resources/linux/packaging/after-install.sh resources/linux/packaging/
          cp ../harness/orca-hardening/source/resources/linux/packaging/after-remove.sh resources/linux/packaging/
          cp ../harness/orca-hardening/source/config/scripts/linux-hardened-launcher.test.mjs config/scripts/
          chmod +x resources/linux/bin/orca-hardened-desktop \
            resources/linux/packaging/after-install.sh \
            resources/linux/packaging/after-remove.sh
          python ../harness/orca-hardening/scripts/apply-task4-packaging.py

          git diff --check
          bash -n resources/linux/bin/orca-hardened-desktop
          bash -n resources/linux/packaging/after-install.sh
          bash -n resources/linux/packaging/after-remove.sh
          git diff --binary > /tmp/reconstructed-release.patch

      - name: Prove source matches the verified binary build inputs
        run: |
          set -euxo pipefail
          cmp /tmp/reconstructed-release.patch "$VERIFIED_PATCH"
          sha256sum /tmp/reconstructed-release.patch "$VERIFIED_PATCH"

      - name: Add reproducibility and installation documentation
        run: |
          set -euo pipefail
          cp "$INSTALL_DOC" source/INSTALL-LINUX.md
          cp "$BUILD_MANIFEST" source/BUILD-MANIFEST.txt
          cat > source/UPSTREAM.lock <<EOF
          repository=${UPSTREAM_REPOSITORY}
          commit=${UPSTREAM_SHA}
          hardening_harness_commit=${HARDENING_HARNESS_SHA}
          verified_build_run=${VERIFIED_BUILD_RUN_ID}
          version=${VERSION}
          platform=linux
          architecture=amd64
          package=deb
          EOF
          mkdir -p source/docs/hardening
          cat > source/docs/hardening/RELEASE.md <<'EOF'
          # Orca Linux Hardened

          Linux-only hardened build of Orca. The release is based on a pinned upstream commit and is intentionally distributed as a Debian `amd64` package, not as AppImage or RPM.

          ## Included safeguards

          - Descendant-aware terminal teardown also covers agents manually started inside a plain shell.
          - A Linux admission governor limits terminal count, agent count, concurrent starts, and projected memory consumption using `/proc/meminfo` `MemAvailable`.
          - Settled orchestration workers enter Orca's existing ownership-aware release path automatically.
          - The desktop launcher uses a transient user-systemd scope with memory, swap, and process-count boundaries, with direct execution as a compatibility fallback.

          ## Verification

          The published `.deb` came from GitHub Actions run `33943045541` on Ubuntu 24.04. That run executed the hardening regression suite, Node typecheck, changed-code quality checks, Electron build, package inspection, packaged CLI smoke test, real `apt` installation, launcher verification, package removal, and cleanup verification.

          ## Supported release target

          - Linux `amd64`
          - Debian/Ubuntu package installation through `apt`
          - Verified build host: Ubuntu 24.04

          ARM64, RPM-based distributions, AppImage, macOS, and Windows are outside this release.
          EOF

      - name: Create portable source branch, archive, bundle and patch
        run: |
          set -euo pipefail
          rm -rf publish-source release-assets
          mkdir -p publish-source release-assets
          rsync -a --delete --exclude='.git' source/ publish-source/
          cp "$DEB" "release-assets/orca-ide_${VERSION}_amd64.deb"
          cp "$INSTALL_DOC" release-assets/INSTALL-LINUX.md
          cp "$BUILD_MANIFEST" release-assets/BUILD-MANIFEST.txt
          cp "$VERIFIED_PATCH" release-assets/orca-linux-hardened.patch

          git -C publish-source init --initial-branch="$SOURCE_BRANCH"
          git -C publish-source config user.name 'Orca Linux Hardened'
          git -C publish-source config user.email 'noreply@users.noreply.github.com'
          git -C publish-source add -A
          git -C publish-source commit -m "feat(linux): Orca Hardened ${VERSION}"
          source_commit="$(git -C publish-source rev-parse HEAD)"
          printf '%s\n' "$source_commit" > release-assets/SOURCE-COMMIT.txt

          git -C publish-source remote add publish \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C publish-source push --force publish \
            "HEAD:refs/heads/${SOURCE_BRANCH}"

          git -C publish-source archive \
            --format=tar.gz \
            --prefix="orca-linux-hardened-${VERSION}/" \
            -o "$GITHUB_WORKSPACE/release-assets/orca-linux-hardened-source-${VERSION}.tar.gz" \
            HEAD
          git -C publish-source bundle create \
            "$GITHUB_WORKSPACE/release-assets/orca-linux-hardened-${VERSION}.bundle" \
            "$SOURCE_BRANCH"
          cp /tmp/reconstructed-release.patch \
            release-assets/orca-linux-hardened-reconstructed.patch

          cat > release-assets/RELEASE-MANIFEST.txt <<EOF
          product=Orca Linux Hardened
          version=${VERSION}
          platform=linux
          architecture=amd64
          package=deb
          upstream_repository=${UPSTREAM_REPOSITORY}
          upstream_sha=${UPSTREAM_SHA}
          hardening_harness_sha=${HARDENING_HARNESS_SHA}
          verified_build_run_id=${VERIFIED_BUILD_RUN_ID}
          source_branch=${SOURCE_BRANCH}
          source_commit=${source_commit}
          deb_sha256=${EXPECTED_DEB_SHA256}
          EOF

          (cd release-assets && sha256sum \
            "orca-ide_${VERSION}_amd64.deb" \
            orca-linux-hardened.patch \
            orca-linux-hardened-reconstructed.patch \
            "orca-linux-hardened-source-${VERSION}.tar.gz" \
            "orca-linux-hardened-${VERSION}.bundle" \
            BUILD-MANIFEST.txt \
            INSTALL-LINUX.md \
            RELEASE-MANIFEST.txt \
            SOURCE-COMMIT.txt > SHA256SUMS)

      - name: Verify all portable source forms
        run: |
          set -euxo pipefail
          (cd release-assets && sha256sum -c SHA256SUMS)
          git bundle verify "release-assets/orca-linux-hardened-${VERSION}.bundle"

          git clone --quiet -b "$SOURCE_BRANCH" \
            "release-assets/orca-linux-hardened-${VERSION}.bundle" \
            /tmp/bundle-checkout
          test -f /tmp/bundle-checkout/src/main/daemon/linux-terminal-spawn-admission.ts
          test -f /tmp/bundle-checkout/src/main/runtime/orchestration/worker-terminal-auto-release.ts
          test -x /tmp/bundle-checkout/resources/linux/bin/orca-hardened-desktop
          test -f /tmp/bundle-checkout/INSTALL-LINUX.md
          test -f /tmp/bundle-checkout/UPSTREAM.lock
          test -z "$(git -C /tmp/bundle-checkout status --porcelain)"

          mkdir -p /tmp/tar-checkout
          tar -xzf "release-assets/orca-linux-hardened-source-${VERSION}.tar.gz" \
            -C /tmp/tar-checkout
          tarroot="/tmp/tar-checkout/orca-linux-hardened-${VERSION}"
          test -f "$tarroot/src/main/daemon/linux-terminal-spawn-admission.ts"
          test -f "$tarroot/src/main/runtime/orchestration/worker-terminal-auto-release.ts"
          test -x "$tarroot/resources/linux/bin/orca-hardened-desktop"

          actual_deb_sha="$(sha256sum "release-assets/orca-ide_${VERSION}_amd64.deb" | cut -d' ' -f1)"
          test "$actual_deb_sha" = "$EXPECTED_DEB_SHA256"

      - name: Write public release notes
        run: |
          cat > release-assets/RELEASE-NOTES.md <<EOF
          # Orca Linux Hardened ${VERSION}

          Installable Linux amd64 release based on upstream Orca commit \`${UPSTREAM_SHA}\`.

          ## Install

          \`\`\`bash
          wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/orca-ide_${VERSION}_amd64.deb
          echo "${EXPECTED_DEB_SHA256}  orca-ide_${VERSION}_amd64.deb" | sha256sum -c -
          sudo apt install ./orca-ide_${VERSION}_amd64.deb
          orca-hardened-desktop
          \`\`\`

          ## Hardened behavior

          - descendant-aware cleanup for manually launched agents and MCP descendants;
          - pre-spawn Linux admission limits based on process counts and available memory;
          - automatic ownership-aware release for settled orchestration workers;
          - desktop-level systemd memory, swap, and task boundaries;
          - Debian package only; AppImage and RPM intentionally excluded.

          ## Verification

          The binary was produced by successful workflow run ${VERIFIED_BUILD_RUN_ID} on Ubuntu 24.04 and passed regression tests, typecheck, changed-code quality checks, Electron build, package inspection, packaged CLI smoke, real apt installation, launcher verification, package removal, and cleanup verification.

          Supported target: Linux amd64 on Debian/Ubuntu-family systems. This release does not claim ARM64 or non-DEB distribution support.
          EOF

      - name: Create or update the GitHub Release
        run: |
          set -euo pipefail
          assets=(
            "release-assets/orca-ide_${VERSION}_amd64.deb"
            release-assets/INSTALL-LINUX.md
            release-assets/BUILD-MANIFEST.txt
            release-assets/RELEASE-MANIFEST.txt
            release-assets/SHA256SUMS
            release-assets/SOURCE-COMMIT.txt
            release-assets/orca-linux-hardened.patch
            release-assets/orca-linux-hardened-reconstructed.patch
            "release-assets/orca-linux-hardened-source-${VERSION}.tar.gz"
            "release-assets/orca-linux-hardened-${VERSION}.bundle"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_BRANCH" \
              --title "Orca Linux Hardened ${VERSION} (amd64)" \
              --notes-file release-assets/RELEASE-NOTES.md \
              --prerelease
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_BRANCH" \
              --title "Orca Linux Hardened ${VERSION} (amd64)" \
              --notes-file release-assets/RELEASE-NOTES.md \
              --prerelease "${assets[@]}"
          fi

      - name: Verify published branch and release assets
        run: |
          set -euxo pipefail
          remote_source_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_BRANCH}" \
            --jq '.object.sha')"
          expected_source_sha="$(cat release-assets/SOURCE-COMMIT.txt)"
          test "$remote_source_sha" = "$expected_source_sha"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          for name in \
            "orca-ide_${VERSION}_amd64.deb" \
            INSTALL-LINUX.md \
            BUILD-MANIFEST.txt \
            RELEASE-MANIFEST.txt \
            SHA256SUMS \
            SOURCE-COMMIT.txt \
            orca-linux-hardened.patch \
            orca-linux-hardened-reconstructed.patch \
            "orca-linux-hardened-source-${VERSION}.tar.gz" \
            "orca-linux-hardened-${VERSION}.bundle"; do
            jq -e --arg name "$name" '.assets[] | select(.name == $name and .size > 0)' \
              <<<"$release_json" >/dev/null
          done

          published_deb_size="$(jq -r --arg name "orca-ide_${VERSION}_amd64.deb" \
            '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
          local_deb_size="$(stat -c %s "release-assets/orca-ide_${VERSION}_amd64.deb")"
          test "$published_deb_size" = "$local_deb_size"

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: orca-linux-hardened-publication-evidence-${{ env.VERSION }}
          retention-days: 14
          compression-level: 0
          path: |
            release-assets/RELEASE-NOTES.md
            release-assets/RELEASE-MANIFEST.txt
            release-assets/SHA256SUMS
            release-assets/SOURCE-COMMIT.txt
