name: Orca Linux Hardened Production

on:
  push:
    branches: [orca-linux-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-linux-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout build control
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - name: Set up pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false
      - name: Execute reproducible Linux release gate
        run: bash ci/build-orca-linux.sh
      - name: Upload verified Linux release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orca-hardened-linux-amd64-1.4.198-hardened.1
          path: out/*
          if-no-files-found: error
          retention-days: 30
