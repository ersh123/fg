name: Orca Linux Cgroup Launcher GREEN

on:
  push:
    branches: [orca-hardening-ci]
    paths:
      - '.github/workflows/orca-hardening-task4.yml'
      - 'orca-hardening/source/resources/linux/**'
      - 'orca-hardening/source/config/scripts/linux-hardened-launcher.test.mjs'
      - 'orca-hardening/scripts/apply-task4-packaging.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cgroup-launcher-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: 67e22345daf882190911355eed152ef33e051c5e
          path: source
      - name: Apply all verified Linux hardening layers
        run: |
          set -euo pipefail
          base64 -d harness/orca-hardening/patches/task1-green.patch.gz.b64 | gzip -d > /tmp/task1.patch
          cd source
          git apply /tmp/task1.patch
          cp ../harness/orca-hardening/source/src/main/daemon/linux-terminal-spawn-admission.ts src/main/daemon/
          cp ../harness/orca-hardening/source/src/main/daemon/linux-terminal-spawn-admission.test.ts src/main/daemon/
          cp ../harness/orca-hardening/source/src/main/daemon/daemon-server-linux-admission.test.ts src/main/daemon/
          python ../harness/orca-hardening/scripts/apply-task2-wiring.py
          cp ../harness/orca-hardening/source/src/main/runtime/orchestration/worker-terminal-auto-release.ts src/main/runtime/orchestration/
          cp ../harness/orca-hardening/source/src/main/runtime/orchestration/worker-terminal-auto-release.test.ts src/main/runtime/orchestration/
          cp ../harness/orca-hardening/source/src/main/runtime/rpc/methods/orchestration-worker-auto-release-wiring.test.ts src/main/runtime/rpc/methods/
          python ../harness/orca-hardening/scripts/apply-task3-wiring.py
          cp ../harness/orca-hardening/source/resources/linux/bin/orca-hardened-desktop resources/linux/bin/
          cp ../harness/orca-hardening/source/resources/linux/packaging/after-install.sh resources/linux/packaging/
          cp ../harness/orca-hardening/source/resources/linux/packaging/after-remove.sh resources/linux/packaging/
          cp ../harness/orca-hardening/source/config/scripts/linux-hardened-launcher.test.mjs config/scripts/
          chmod +x resources/linux/bin/orca-hardened-desktop resources/linux/packaging/after-install.sh resources/linux/packaging/after-remove.sh
          python ../harness/orca-hardening/scripts/apply-task4-packaging.py
          git diff --check
          bash -n resources/linux/bin/orca-hardened-desktop
          bash -n resources/linux/packaging/after-install.sh
          bash -n resources/linux/packaging/after-remove.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Run launcher and maintainer-script contracts
        working-directory: source
        run: |
          node --test config/scripts/linux-hardened-launcher.test.mjs
          pnpm exec vitest run --config config/vitest.config.ts config/scripts/linux-package-maintainer-scripts.test.mjs
      - name: Run hardened regression suite
        working-directory: source
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/daemon/linux-terminal-spawn-admission.test.ts
          src/main/daemon/daemon-server-linux-admission.test.ts
          src/main/daemon/daemon-server-attach-only.test.ts
          src/main/daemon/terminal-session-teardown.test.ts
          src/main/daemon/session.test.ts
          src/main/runtime/orchestration/worker-terminal-auto-release.test.ts
          src/main/runtime/rpc/methods/orchestration-worker-auto-release-wiring.test.ts
          src/main/runtime/rpc/methods/orchestration-send.test.ts
          src/main/runtime/rpc/methods/orchestration-check.test.ts
          src/main/runtime/rpc/methods/orchestration-worker-release.test.ts
      - name: Typecheck Node code
        working-directory: source
        run: pnpm tc:node
      - name: Check changed-file quality
        working-directory: source
        run: pnpm run check:code-quality:changed -- 67e22345daf882190911355eed152ef33e051c5e
