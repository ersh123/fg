name: Orca Linux Admission Unit GREEN

on:
  push:
    branches: [orca-hardening-ci]
    paths:
      - '.github/workflows/orca-hardening-red.yml'
      - 'orca-hardening/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-admission-unit-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: 67e22345daf882190911355eed152ef33e051c5e
          path: source
      - name: Apply completed teardown and admission policy
        run: |
          base64 -d harness/orca-hardening/patches/task1-green.patch.gz.b64 | gzip -d > /tmp/task1.patch
          cd source
          git apply /tmp/task1.patch
          cp ../harness/orca-hardening/source/src/main/daemon/linux-terminal-spawn-admission.ts src/main/daemon/
          cp ../harness/orca-hardening/source/src/main/daemon/linux-terminal-spawn-admission.test.ts src/main/daemon/
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Run admission policy tests
        working-directory: source
        run: pnpm exec vitest run --config config/vitest.config.ts src/main/daemon/linux-terminal-spawn-admission.test.ts
      - name: Typecheck Node code
        working-directory: source
        run: pnpm tc:node
      - name: Check changed-file quality
        working-directory: source
        run: pnpm run check:code-quality:changed -- 67e22345daf882190911355eed152ef33e051c5e
