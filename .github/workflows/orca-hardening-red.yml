name: Orca Linux Hardening GREEN

on:
  push:
    branches: [orca-hardening-ci]
    paths:
      - '.github/workflows/orca-hardening-red.yml'
      - 'orca-hardening/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-teardown-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout hardening harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout pinned Orca source
        uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: 67e22345daf882190911355eed152ef33e051c5e
          path: source

      - name: Apply GREEN implementation
        run: |
          base64 -d harness/orca-hardening/patches/task1-green.patch.gz.b64 | gzip -d > /tmp/task1-green.patch
          cd source
          git apply --check /tmp/task1-green.patch
          git apply /tmp/task1-green.patch
          git diff --check

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run terminal teardown tests
        working-directory: source
        run: pnpm exec vitest run --config config/vitest.config.ts src/main/daemon/terminal-session-teardown.test.ts src/main/daemon/session.test.ts src/main/daemon/session-terminal-control.test.ts src/main/daemon/repro-12101-mouse-tracking-survives-agent-death.test.ts

      - name: Typecheck Node code
        working-directory: source
        run: pnpm tc:node

      - name: Check changed-file quality
        working-directory: source
        run: pnpm run check:code-quality:changed -- 67e22345daf882190911355eed152ef33e051c5e
