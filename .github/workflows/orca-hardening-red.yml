name: Orca Linux Admission RED

on:
  push:
    branches: [orca-hardening-ci]
    paths:
      - '.github/workflows/orca-hardening-red.yml'
      - 'orca-hardening/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-admission-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: 67e22345daf882190911355eed152ef33e051c5e
          path: source
      - name: Apply completed teardown and admission RED tests
        run: |
          base64 -d harness/orca-hardening/patches/task1-green.patch.gz.b64 | gzip -d > /tmp/task1.patch
          base64 -d harness/orca-hardening/patches/task2-red.patch.gz.b64 | gzip -d > /tmp/task2-red.patch
          cd source
          git apply /tmp/task1.patch
          git apply --check /tmp/task2-red.patch
          git apply /tmp/task2-red.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Run admission RED tests
        working-directory: source
        run: pnpm exec vitest run --config config/vitest.config.ts src/main/daemon/linux-terminal-spawn-admission.test.ts
